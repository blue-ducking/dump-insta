# Low-memory friendly settings so the build also works on small CI runners.
org.gradle.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=320m -Xss4m -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=false
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
kotlin.daemon.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=256m
